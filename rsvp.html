<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP · Myrthe & Wisse</title>
<meta name="description" content="Laat ons weten of je erbij bent.">
<meta name="theme-color" content="#F7F2EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="topbar__names" href="index.html">Myrthe &amp; Wisse</a>
  <button class="topbar__knop" type="button" aria-expanded="false" aria-controls="hoofdmenu">Menu</button>
  <nav class="topbar__nav" id="hoofdmenu" aria-label="Hoofdmenu">
      <a href="index.html">Welkom</a>
      <a href="programma.html">Programma</a>
      <a href="dresscode.html">Dresscode</a>
      <a href="locaties.html">Locaties</a>
      <a href="vervoer.html">Vervoer</a>
      <a href="overnachten.html">Overnachten</a>
      <a href="contact.html">Contact</a>
      <a href="rsvp.html" aria-current="page">RSVP</a>
  </nav>
</header>

<main class="page">
  <div class="page__head">
    <h1 class="page__title">RSVP</h1>
    <img class="divider" src="imgs/takje-hart.png" width="172" height="47" alt="" aria-hidden="true">
  </div>

  <p class="page__intro">Laat ons v&oacute;&oacute;r <strong data-rsvp-deadline>[datum]</strong> weten of je erbij bent.</p>

  <form class="rsvp" id="rsvp-form" novalidate>
    <div id="gasten"></div>

    <template id="gast-sjabloon">
      <fieldset class="gast">
        <legend class="gast__titel">Naam</legend>
        <button class="gast__weg" type="button" hidden>Verwijderen</button>

        <div class="field">
          <label for="naam-__n__">Naam</label>
          <input id="naam-__n__" name="naam-__n__" type="text" autocomplete="name" data-veld="naam" required>
        </div>

        <fieldset class="field">
          <legend>Kom je?</legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="komt-__n__" value="ja" data-veld="komt" checked> Ja, ik ben erbij</label>
            <label class="choice"><input type="radio" name="komt-__n__" value="nee" data-veld="komt"> Nee, helaas niet</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="allergie-__n__">Allergie&euml;n</label>
          <input id="allergie-__n__" name="allergie-__n__" type="text" data-veld="allergie" placeholder="Geen">
        </div>

        <fieldset class="field">
          <legend>Eet je vegetarisch?</legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="vega-__n__" value="nee" data-veld="vega" checked> Nee</label>
            <label class="choice"><input type="radio" name="vega-__n__" value="ja" data-veld="vega"> Ja</label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Bus naar Van der Valk Sneek</legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="bus-__n__" value="nee" data-veld="bus" checked> Nee, ik regel het zelf</label>
            <label class="choice"><input type="radio" name="bus-__n__" value="ja" data-veld="bus"> Ja, graag</label>
          </div>
        </fieldset>
      </fieldset>
    </template>

    <button class="button button--stil" type="button" id="gast-erbij">Iemand meenemen</button>
    <button class="button" type="submit">Verstuur RSVP</button>

    <p class="rsvp__fallback">
      Liever gewoon een mailtje of appje? Dat mag natuurlijk ook &mdash;
      <a class="link" href="mailto:rsvp@myrthewisse.nl" data-rsvp-mail>rsvp@myrthewisse.nl</a>.
    </p>
  </form>

  <img class="ornament ornament--end" src="imgs/takje-hart.png" width="172" height="47" alt="" aria-hidden="true">

</main>

<script src="script.js"></script>
</body>
</html>
