<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP · Myrthe & Wisse</title>
<meta name="description" content="Laat ons weten of je erbij bent.">
<meta name="theme-color" content="#F7F2EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="topbar__names" href="./">Myrthe &amp; Wisse</a>
  <button class="topbar__knop" type="button" aria-expanded="false" aria-controls="hoofdmenu">Menu</button>
  <nav class="topbar__nav" id="hoofdmenu" aria-label="Hoofdmenu">
      <a href="./">Welkom</a>
      <a href="programma">Programma</a>
      <a href="dresscode">Dresscode</a>
      <a href="locaties">Locaties</a>
      <a href="vervoer">Vervoer</a>
      <a href="overnachten">Overnachten</a>
      <a href="contact">Contact</a>
      <a href="rsvp" aria-current="page">RSVP</a>
  </nav>
</header>

<main class="page">
  <div class="page__head">
    <h1 class="page__title">RSVP</h1>
    <img class="divider" src="imgs/takje-hart.png" width="172" height="47" alt="" aria-hidden="true">
  </div>

  <p class="page__intro">Laat ons v&oacute;&oacute;r <strong data-rsvp-deadline>[datum]</strong> weten of je erbij bent.
  </p>

  <form class="rsvp" id="rsvp-form" novalidate>
    <div class="field">
      <label for="naam">Naam</label>
      <input id="naam" name="naam" type="text" autocomplete="name" required>
    </div>

    <fieldset class="field">
      <legend>Kom je?</legend>
      <div class="choices">
        <label class="choice"><input type="radio" name="komt" value="ja" checked> Ja, ik ben erbij</label>
        <label class="choice"><input type="radio" name="komt" value="nee"> Nee, helaas niet</label>
      </div>
    </fieldset>

    <div class="field">
      <label for="allergie">Allergie&euml;n</label>
      <input id="allergie" name="allergie" type="text" placeholder="Geen">
    </div>

    <fieldset class="field">
      <legend>Eet je vegetarisch?</legend>
      <div class="choices">
        <label class="choice"><input type="radio" name="vega" value="nee" checked> Nee</label>
        <label class="choice"><input type="radio" name="vega" value="ja"> Ja</label>
      </div>
    </fieldset>

    <fieldset class="field">
      <legend>Bus naar Van der Valk Sneek (voor mensen die niet op de Pollepleats slapen)</legend>
      <div class="choices">
        <label class="choice"><input type="radio" name="bus" value="nee" checked> Nee, ik regel het zelf</label>
        <label class="choice"><input type="radio" name="bus" value="ja"> Ja, graag</label>
      </div>
    </fieldset>

    <button class="button" type="submit">Verstuur RSVP</button>

  </form>

  <img class="ornament ornament--end" src="imgs/takje-hart.png" width="172" height="47" alt="" aria-hidden="true">

</main>

<script src="script.js"></script>
</body>
</html>
